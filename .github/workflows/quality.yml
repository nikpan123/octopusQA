name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - fixes

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality checks
        run: npm run quality

      - name: Unit tests
        # Testy jednostkowe sesji i panelu korzystają z izolowanej przeglądarki.
        # Sieć jest przechwycona i nie kontaktują się ze środowiskiem DEV.
        run: npx playwright install --with-deps chromium && npm run test:unit
